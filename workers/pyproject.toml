[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-worker"
version = "0.1.0"
description = "HELM's agent runtime: durable, checkpointed LangGraph agents"
requires-python = ">=3.13,<3.15"

[tool.setuptools.packages.find]
include = ["helm_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["helm_worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
files = ["helm_worker", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true
